name: APK yig'ish

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug APK yig'ish
        run: ./gradlew assembleDebug --no-daemon

      - name: APK nomini tayyorlash
        run: cp app/build/outputs/apk/debug/app-debug.apk SeyfKontakt.apk

      - name: Artifact sifatida yuklash
        uses: actions/upload-artifact@v4
        with:
          name: SeyfKontakt-APK
          path: SeyfKontakt.apk

      - name: Releases'ga chiqarish (to'g'ridan-to'g'ri yuklab olish uchun)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Seyf Kontakt APK #${{ github.run_number }}
          prerelease: true
          files: SeyfKontakt.apk
